<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="website icon" href="imags/projects.jpeg">
    <title>CSSnippets - Portfolio</title>
    
    <style>
        /* --- CSS الخاص بك مع تعديلات الإخفاء والإظهار --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Poppins", sans-serif; 
            background: #0f172a;
            color: white;
            overflow-x: hidden;
        }
        header {
            padding: 20px;
        }
        nav {
            padding: 1rem 5%;
            background: rgba(255, 255, 255, 0.05); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(34, 255, 0, 0.3);
            gap: 15px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #22ff00;
            text-shadow: 0 0 10px #22ff00;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 2rem;
        }
        .nav-links li a {
            font-size: 1.05rem;
            font-weight: 500;
            text-decoration: none;
            color: #ffffff;
            transition: 0.3s;
            cursor: pointer;
        }
        .nav-links li a:hover {
            color: #22ff00;
            text-shadow: 0 0 10px #22ff00;
        }
        .btn {
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            background: #22ff00;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            box-shadow: 0 0 20px #22ff00;
        }

        /* --- سر التبديل بين الصفحات --- */
        section {
            display: none; /* إخفاء الكل افتراضياً */
            padding: 2rem 5%;
            animation: fadeIn 0.6s ease-out;
        }

        section.active {
            display: block; /* إظهار القسم النشط فقط */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- تنسيق الكروت --- */
        .project-card1 {
            height: 400px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #22ff00;
        }
        .yo {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .project-card {
            width: 300px;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 10px 15px rgba(34, 255, 0, 0.1);
        }
        .project-card img {
            width: 100%;
            border-radius: 15px;
        }
        .btn2 {
            display: block;
            text-align: center;
            padding: 10px;
            background: #22ff00;
            color: black;
            text-decoration: none;
            border-radius: 20px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            nav { flex-direction: column; border-radius: 20px; }
            .nav-links { gap: 1rem; }
        }
    </style>
</head>
<body>

<header>
    <nav>
        <div class="logo">CSSnippets</div>
        <ul class="nav-links">
            <li><a onclick="showPage('Home')">Home</a></li>
            <li><a onclick="showPage('project')">Projects</a></li>
        </ul>
        <div class="btns">
            <button class="btn">Login</button>
        </div>
    </nav>
</header>

<section id="Home" class="active">
    <div class="project-card1">
        <h1>Welcome to My Workspace</h1>
    </div>
</section>

<section id="project">
    <div class="yo">
        <div class="project-card">
            <img src="imags/project 1.jpeg" alt="Project">
            <h3>Login Form</h3>
            <p>HTML/CSS Project with source code.</p>
            <a href="#" class="btn2">Download</a>
        </div>
        </div>
</section>

<script>
    function showPage(pageId) {
        // 1. إخفاء جميع الأقسام بحذف كلاس active
        const sections = document.querySelectorAll('section');
        sections.forEach(sec => {
            sec.classList.remove('active');
        });

        // 2. إظهار القسم المطلوب بإضافة كلاس active له
        const target = document.getElementById(pageId);
        if (target) {
            target.classList.add('active');
        }
    }
</script>

</body>
</html>
